<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="학생을 위한 간단한 할 일 관리 앱">
  <title>to-do-list</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell container py-4 py-lg-5">
    <header class="app-header mb-4">
      <p class="eyebrow mb-2">STUDY DESK / TASK MANAGER</p>
      <h1 class="display-5 fw-bold mb-2">to-do-list</h1>
      <p class="text-secondary mb-0">오늘 해야 할 일을 작게 나누고, 하나씩 끝내보세요.</p>
    </header>

    <section class="workspace-panel p-3 p-md-4" aria-label="할 일 관리 영역">
      <nav class="category-nav mb-4" aria-label="카테고리별 할 일">
        <div class="nav nav-pills gap-2" id="categoryTabs">
          <button class="nav-link active" type="button" data-category="all" aria-selected="true">전체 <span class="tab-count">0</span></button>
          <button class="nav-link" type="button" data-category="assignment" aria-selected="false">과제 <span class="tab-count">0</span></button>
          <button class="nav-link" type="button" data-category="personal" aria-selected="false">개인 <span class="tab-count">0</span></button>
          <button class="nav-link" type="button" data-category="other" aria-selected="false">기타 <span class="tab-count">0</span></button>
        </div>
      </nav>

      <form id="todoForm" class="todo-form row g-2 align-items-end" novalidate>
        <div class="col-12 col-lg-5">
          <label class="form-label" for="todoText">새로운 할 일</label>
          <input class="form-control form-control-lg" id="todoText" name="text" type="text" maxlength="200" placeholder="예: 수학 과제 제출하기" autocomplete="off" required>
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label" for="todoCategory">카테고리</label>
          <select class="form-select form-select-lg" id="todoCategory" name="category">
            <option value="assignment">과제</option>
            <option value="personal">개인</option>
            <option value="other">기타</option>
          </select>
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label" for="todoPriority">우선순위</label>
          <select class="form-select form-select-lg" id="todoPriority" name="priority">
            <option value="high">높음</option>
            <option value="medium" selected>보통</option>
            <option value="low">낮음</option>
          </select>
        </div>
        <div class="col-8 col-lg-2">
          <label class="form-label" for="todoDueDate">마감일 <span class="text-secondary fw-normal">선택</span></label>
          <input class="form-control form-control-lg" id="todoDueDate" name="dueDate" type="date">
        </div>
        <div class="col-4 col-lg-1 d-grid">
          <button class="btn btn-primary btn-lg" type="submit">추가</button>
        </div>
        <div class="col-12" aria-live="polite">
          <div id="formFeedback" class="form-feedback" role="alert" hidden></div>
        </div>
      </form>

      <div class="progress-summary mt-4 mb-4">
        <div class="d-flex justify-content-between align-items-end mb-2">
          <div>
            <p class="section-kicker mb-1">PROGRESS</p>
            <h2 class="h5 mb-0">오늘의 진행 상황</h2>
          </div>
          <strong id="progressText" class="progress-percent">0%</strong>
        </div>
        <div class="progress" role="progressbar" aria-label="전체 할 일 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progressBar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-3">
        <div>
          <p class="section-kicker mb-1">MY LIST</p>
          <h2 class="h5 mb-0">할 일 목록</h2>
        </div>
        <div class="filter-group btn-group" id="statusFilters" role="group" aria-label="완료 상태 필터">
          <button class="btn btn-sm btn-outline-secondary active" type="button" data-filter="all" aria-pressed="true">전체</button>
          <button class="btn btn-sm btn-outline-secondary" type="button" data-filter="active" aria-pressed="false">진행 중</button>
          <button class="btn btn-sm btn-outline-secondary" type="button" data-filter="completed" aria-pressed="false">완료됨</button>
        </div>
      </div>

      <div id="todoList" class="todo-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state text-center py-5" hidden>
        <div class="empty-mark" aria-hidden="true">—</div>
        <p class="mb-0">등록된 할 일이 없습니다</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
