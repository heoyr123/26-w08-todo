<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="과제와 일상을 간편하게 관리하는 to-do-list"
    />
    <title>to-do-list</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col px-4 py-8 sm:px-6 lg:py-12">
      <header class="mb-8">
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-indigo-600">
          Simple task manager
        </p>
        <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
          to-do-list
        </h1>
        <p class="mt-2 text-slate-500">해야 할 일을 정리하고 오늘의 진행 상황을 확인하세요.</p>
      </header>

      <section class="space-y-6 rounded-2xl bg-white p-4 shadow-xl shadow-slate-200/60 sm:p-6" aria-label="할 일 관리">
        <nav aria-label="카테고리별 할 일">
          <div id="category-tabs" class="flex gap-2 overflow-x-auto border-b border-slate-200 pb-3"></div>
        </nav>

        <form id="todo-form" class="grid gap-3 rounded-xl bg-slate-50 p-4 sm:grid-cols-2 lg:grid-cols-[minmax(0,2fr)_1fr_1fr_1.2fr_auto] lg:items-end" novalidate>
          <div class="sm:col-span-2 lg:col-span-1">
            <label for="todo-text" class="mb-1.5 block text-sm font-medium text-slate-700">할 일</label>
            <input
              id="todo-text"
              name="text"
              type="text"
              maxlength="200"
              autocomplete="off"
              placeholder="새로운 할 일을 입력하세요"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
              required
            />
            <p id="form-error" class="mt-1.5 hidden text-xs font-medium text-red-600" role="alert"></p>
          </div>

          <div>
            <label for="todo-category" class="mb-1.5 block text-sm font-medium text-slate-700">카테고리</label>
            <select id="todo-category" name="category" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
              <option value="과제">과제</option>
              <option value="개인">개인</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <div>
            <label for="todo-priority" class="mb-1.5 block text-sm font-medium text-slate-700">우선순위</label>
            <select id="todo-priority" name="priority" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
              <option value="high">높음</option>
              <option value="medium" selected>보통</option>
              <option value="low">낮음</option>
            </select>
          </div>

          <div>
            <label for="todo-due-date" class="mb-1.5 block text-sm font-medium text-slate-700">마감일</label>
            <input id="todo-due-date" name="dueDate" type="datetime-local" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
          </div>

          <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            추가
          </button>
        </form>

        <section class="rounded-xl border border-slate-200 p-4" aria-label="진행 상황">
          <div class="mb-2 flex items-center justify-between gap-4">
            <h2 class="text-sm font-semibold text-slate-700">진행 상황</h2>
            <span id="progress-label" class="text-sm font-bold text-indigo-600">0%</span>
          </div>
          <div class="h-2.5 overflow-hidden rounded-full bg-slate-100">
            <div id="progress-bar" class="h-full rounded-full bg-indigo-600 transition-all duration-300" style="width: 0%" role="progressbar" aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
          </div>
          <p id="progress-count" class="mt-2 text-xs text-slate-500">완료 0 / 전체 0</p>
        </section>

        <div id="status-filters" class="flex gap-2" role="group" aria-label="완료 상태 필터">
          <button type="button" data-filter="all" class="filter-button rounded-lg px-3 py-2 text-sm font-semibold transition">전체</button>
          <button type="button" data-filter="active" class="filter-button rounded-lg px-3 py-2 text-sm font-semibold transition">진행 중</button>
          <button type="button" data-filter="completed" class="filter-button rounded-lg px-3 py-2 text-sm font-semibold transition">완료됨</button>
        </div>

        <section aria-label="할 일 목록">
          <ul id="todo-list" class="space-y-3"></ul>
          <div id="empty-state" class="hidden rounded-xl border border-dashed border-slate-300 px-4 py-16 text-center text-slate-500">
            등록된 할 일이 없습니다
          </div>
        </section>
      </section>
    </main>

    <div
      id="delete-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/50 p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-modal-title"
      aria-describedby="delete-modal-description"
    >
      <div class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-2xl">
        <div class="despair-icon mx-auto mb-4" aria-hidden="true">
          <span class="despair-icon__eye despair-icon__eye--left"></span>
          <span class="despair-icon__eye despair-icon__eye--right"></span>
          <span class="despair-icon__tear despair-icon__tear--left"></span>
          <span class="despair-icon__tear despair-icon__tear--right"></span>
          <span class="despair-icon__mouth"></span>
        </div>
        <h2 id="delete-modal-title" class="text-lg font-bold text-slate-900">할 일을 삭제할까요?</h2>
        <p id="delete-modal-description" class="mt-2 text-sm text-slate-500">
          삭제한 할 일은 다시 복구할 수 없습니다.
        </p>
        <div class="mt-6 flex justify-center gap-3">
          <button
            id="delete-cancel"
            type="button"
            class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          >
            취소
          </button>
          <button
            id="delete-confirm"
            type="button"
            class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-200"
          >
            삭제하기
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
